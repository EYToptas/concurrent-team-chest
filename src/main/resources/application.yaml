# Application settings.
spring:
  application:
    name: team-chest

  datasource:
    hikari:
      transaction-isolation: TRANSACTION_READ_COMMITTED
      connection-init-sql: SET SESSION innodb_lock_wait_timeout = 2
      maximum-pool-size: 20

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        type:
          preferred_instant_jdbc_type: TIMESTAMP

  flyway:
    enabled: true

  data:
    redis:
      timeout: 200ms
      connect-timeout: 500ms
      repositories:
        enabled: false

management:
  health:
    redis:
      enabled: false

team-chest:
  campaign:
    claim-grace-period: 7d
  transaction:
    max-attempts: 3
    min-backoff: 5ms
    max-backoff: 25ms
  redis:
    failure-cooldown: 2s
  cache:
    enabled: true
    team-ttl: 30s
    membership-ttl: 10m
  rate-limit:
    enabled: true
    join:
      capacity: 5
      refill-per-second: 1
    progress:
      capacity: 20
      refill-per-second: 10
    claim:
      capacity: 5
      refill-per-second: 1
    get:
      capacity: 30
      refill-per-second: 15
  security:
    jwt:
      audience: team-chest-api
      clock-skew: 30s
