# Application settings.
spring:
  application:
    name: team-chest

  datasource:
    hikari:
      transaction-isolation: TRANSACTION_READ_COMMITTED
      connection-init-sql: SET SESSION innodb_lock_wait_timeout = 2
      maximum-pool-size: 20

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        type:
          preferred_instant_jdbc_type: TIMESTAMP

  flyway:
    enabled: true

team-chest:
  campaign:
    claim-grace-period: 7d
  transaction:
    max-attempts: 3
    min-backoff: 5ms
    max-backoff: 25ms
